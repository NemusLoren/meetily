name: "Rilascio"

# Crea una bozza di release su GitHub con gli installer per macOS e Windows.
# Gli installer non sono firmati: vedi docs/INSTALLAZIONE.md per le avvertenze del sistema.
# La bozza va controllata e pubblicata a mano dalla pagina "Releases".

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Crea bozza di release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Leggi la versione da tauri.conf.json e controlla i tag
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' frontend/src-tauri/tauri.conf.json | cut -d'"' -f4)
          git fetch --tags
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "ERRORE: il tag v${VERSION} esiste già. Aumenta la versione in tauri.conf.json."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Crea la bozza
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ steps.get-version.outputs.version }}`,
              target_commitish: context.sha,
              name: `Trascrivi Seduta v${{ steps.get-version.outputs.version }}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            })
            return data.id

  build:
    name: Build ${{ matrix.name }}
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "macOS (Apple Silicon)"
            platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - name: "Windows"
            platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: false
      upload-artifacts: false # tauri-action carica direttamente sulla release
      release-id: ${{ needs.create-release.outputs.release-id }}
    secrets: inherit
