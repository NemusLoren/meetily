name: Segnala un problema
description: Qualcosa in Trascrivi Seduta non funziona come dovrebbe.
title: "[PROBLEMA] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Grazie per la segnalazione. **Privacy: non allegare né incollare registrazioni, trascrizioni, nomi o dati dei pazienti, né log non ripuliti.** Usa solo esempi inventati.
  - type: input
    id: version
    attributes:
      label: Versione di Trascrivi Seduta
      description: La trovi in Impostazioni → Informazioni. Se l'app non si apre, scrivi "non so".
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Computer e sistema operativo
      placeholder: "Per esempio: Windows 11, oppure MacBook Air M2 con macOS 15"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: Cosa è successo
      description: Descrivi il problema e cosa ti aspettavi.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Come riprodurlo
      placeholder: |
        1. Ho aperto…
        2. Ho premuto…
        3. È comparso…
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Altro (facoltativo)
      description: Messaggi di errore o schermate, solo se non contengono dati reali.
