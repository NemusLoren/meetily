name: Proponi una funzione
description: Un'idea per rendere Trascrivi Seduta più utile nel lavoro clinico.
title: "[IDEA] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Le idee dei colleghi sono il motore del progetto. Non indicare dati reali dei pazienti.
  - type: textarea
    id: need
    attributes:
      label: Che cosa ti serve
      description: Descrivi la situazione di lavoro in cui oggi ti manca qualcosa.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Come lo immagini
      description: Come dovrebbe funzionare, secondo te.
  - type: dropdown
    id: privacy
    attributes:
      label: Riguarda la privacy o la sicurezza dei dati?
      options:
        - "No"
        - "Sì"
        - "Non so"
    validations:
      required: true
